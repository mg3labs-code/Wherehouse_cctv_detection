version: "3.8"

# Local GPU monitor (optional). Railway uses Dockerfile (CPU API) instead.
services:
  gls-safety:
    build: .
    image: gls-warehouse-safety:latest
    container_name: gls-safety-monitor
    environment:
      - PORT=8001
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    ports:
      - "8001:8001"
    restart: unless-stopped
    command: >
      sh -c "uvicorn src.api.app:app --host 0.0.0.0 --port $${PORT:-8001}"
